<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Registration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; display: flex; gap: 50px; }
        .form-container { width: 320px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 2px 2px 10px #eee; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        .msg { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- LOGIN FORM -->
    <div class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="loginUser" placeholder="Username" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div id="loginMsg" class="msg"></div>
    </div>

    <!-- REGISTRATION FORM -->
    <div class="form-container">
        <h2>Create Account</h2>
        <form id="registerForm">
            <input type="text" id="regUser" placeholder="Desired Username" required>
            <input type="password" id="regPass" placeholder="Password" required>
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="mi" placeholder="Middle Initial" maxlength="1">
            <input type="text" id="lastName" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email (e.g., name@uscg.mil)" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <button type="submit">Register</button>
        </form>
        <div id="registerMsg" class="msg"></div>
    </div>

    <script>
        // Handle Registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('regUser').value,
                password: document.getElementById('regPass').value,
                firstName: document.getElementById('firstName').value,
                middleInitial: document.getElementById('mi').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            };

            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const res = await response.json();
            const msgDiv = document.getElementById('registerMsg');
            msgDiv.innerText = res.message;
            msgDiv.style.color = res.success ? 'green' : 'red';
        });

        // Handle Login (Simplified for brevity)
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('loginUser').value,
                    password: document.getElementById('loginPass').value
                })
            });
            const res = await response.json();
            const msgDiv = document.getElementById('loginMsg');
            msgDiv.innerText = res.message;
            msgDiv.style.color = res.success ? 'green' : 'red';
        });
    </script>
</body>
</html>
