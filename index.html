<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automated Login System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; display: flex; gap: 50px; justify-content: center; }
        .form-container { width: 350px; padding: 25px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 2px 2px 12px #ddd; }
        h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .msg { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div class="form-container">
        <h2>Login</h2>
        <p><small>Format: firstname.m.lastname</small></p>
        <form id="loginForm">
            <input type="text" id="loginUser" placeholder="Username (first.m.last)" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div id="loginMsg" class="msg"></div>
    </div>

    <!-- REGISTRATION SECTION -->
    <div class="form-container">
        <h2>Create Account</h2>
        <form id="registerForm">
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="mi" placeholder="Middle Initial" maxlength="1" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="password" id="regPass" placeholder="Set Password" required>
            <button type="submit">Create Account</button>
        </form>
        <div id="registerMsg" class="msg"></div>
    </div>

    <script>
        // Registration Logic
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fName = document.getElementById('firstName').value.trim().toLowerCase();
            const mi = document.getElementById('mi').value.trim().toLowerCase();
            const lName = document.getElementById('lastName').value.trim().toLowerCase();

            // AUTOMATIC USERNAME GENERATION
            const autoUsername = `${fName}.${mi}.${lName}`;

            const data = {
                username: autoUsername,
                password: document.getElementById('regPass').value,
                firstName: document.getElementById('firstName').value,
                middleInitial: document.getElementById('mi').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            };

            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            const res = await response.json();
            const msgDiv = document.getElementById('registerMsg');
            msgDiv.style.display = 'block';
            msgDiv.innerText = res.message;
            msgDiv.style.backgroundColor = res.success ? '#d4edda' : '#f8d7da';
            msgDiv.style.color = res.success ? '#155724' : '#721c24';
        });

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('loginUser').value.toLowerCase(),
                    password: document.getElementById('loginPass').value
                })
            });
            const res = await response.json();
            const msgDiv = document.getElementById('loginMsg');
            msgDiv.style.display = 'block';
            msgDiv.innerText = res.message;
            msgDiv.style.backgroundColor = res.success ? '#d4edda' : '#f8d7da';
            msgDiv.style.color = res.success ? '#155724' : '#721c24';
        });
    </script>
</body>
</html>
