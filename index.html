<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { width: 420px; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        #accountsView { width: 800px; max-width: 95vw; }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .primary-btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .secondary-btn { width: 100%; padding: 10px; background: none; color: #007bff; border: 1px solid #007bff; cursor: pointer; border-radius: 4px; margin-top: 10px; font-size: 14px; width: 100%; }
        .msg { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
        #registerView, #welcomeView, #accountsView { display: none; }
        #welcomeName { color: #0056b3; font-size: 26px; margin-bottom: 5px; display: block; }
        #dateDisplay { color: #555; font-size: 16px; margin-bottom: 25px; display: block; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .grid-btn { background-color: #e9ecef; color: #333; border: 1px solid #ccc; border-radius: 6px; padding: 15px 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; text-align: left; }
        th { background-color: #007bff; color: white; padding: 12px; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

    <div id="loginView" class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="loginUser" placeholder="Username" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <button type="submit" class="primary-btn">Sign In</button>
        </form>
        <div id="loginMsg" class="msg"></div>
        <button type="button" class="secondary-btn" onclick="showReg()">Register for account</button>
    </div>

    <div id="registerView" class="form-container">
        <h2>Create Account</h2>
        <form id="registerForm">
            <input type="text" id="fName" placeholder="First Name" required>
            <input type="text" id="mI" placeholder="Middle Initial" maxlength="1" required>
            <input type="text" id="lName" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone" required>
            <input type="password" id="regPass" placeholder="Set Password" required>
            <button type="submit" class="primary-btn">Create Account</button>
        </form>
        <div id="registerMsg" class="msg"></div>
        <button type="button" class="secondary-btn" onclick="showLog()">Back to Login</button>
    </div>

    <div id="welcomeView" class="form-container">
        <h1 id="welcomeName"></h1>
        <h3 id="dateDisplay"></h3>
        <div class="btn-grid">
            <button type="button" class="grid-btn">VMRs</button>
            <button type="button" class="grid-btn">Cutter Data Entry</button>
            <button type="button" class="grid-btn">Commercial Vessel Movements</button>
            <button type="button" class="grid-btn">Cutter Movements</button>
        </div>
        <hr>
        <button type="button" class="secondary-btn" onclick="loadAccounts()">View Accounts</button>
        <button type="button" class="secondary-btn" onclick="location.reload()" style="color: #dc3545; border-color: #dc3545;">Sign Out</button>
    </div>

    <div id="accountsView" class="form-container">
        <h2>System Accounts</h2>
        <table>
            <thead><tr><th>Username</th><th>First</th><th>MI</th><th>Last</th><th>Email</th><th>Phone</th></tr></thead>
            <tbody id="accountsTableBody"></tbody>
        </table>
        <button type="button" class="secondary-btn" onclick="showDashboard()">Back to Dashboard</button>
    </div>

    <script>
        function showReg() { document.getElementById('loginView').style.display='none'; document.getElementById('registerView').style.display='block'; }
        function showLog() { document.getElementById('registerView').style.display='none'; document.getElementById('loginView').style.display='block'; }
        function showDashboard() { document.getElementById('accountsView').style.display='none'; document.getElementById('welcomeView').style.display='block'; }

        // Load Accounts using relative path
        function loadAccounts() {
            fetch('/accounts') 
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    var tbody = document.getElementById('accountsTableBody');
                    tbody.innerHTML = '';
                    data.accounts.forEach(acc => {
                        tbody.innerHTML += `<tr><td>${acc.username}</td><td>${acc.firstName}</td><td>${acc.middleInitial}</td><td>${acc.lastName}</td><td>${acc.email}</td><td>${acc.phone}</td></tr>`;
                    });
                    document.getElementById('welcomeView').style.display = 'none';
                    document.getElementById('accountsView').style.display = 'block';
                }
            })
            .catch(err => { console.error(err); alert("Connection Error. Use http://localhost:3000"); });
        }

        document.getElementById('registerForm').onsubmit = function(e) {
            e.preventDefault();
            var f = document.getElementById('fName').value;
            var m = document.getElementById('mI').value;
            var l = document.getElementById('lName').value;
            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: (f+'.'+m+'.'+l).toLowerCase(), password: document.getElementById('regPass').value,
                    firstName: f, middleInitial: m, lastName: l,
                    email: document.getElementById('email').value, phone: document.getElementById('phone').value
                })
            }).then(res => res.json()).then(data => {
                var msg = document.getElementById('registerMsg');
                msg.style.display = 'block'; msg.innerText = data.message;
                msg.style.backgroundColor = data.success ? '#d4edda' : '#f8d7da';
                if(data.success) setTimeout(showLog, 2000);
            });
        };

        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('loginUser').value.toLowerCase().trim(),
                    password: document.getElementById('loginPass').value
                })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    document.getElementById('loginView').style.display = 'none';
                    document.getElementById('welcomeView').style.display = 'block';
                    document.getElementById('welcomeName').innerText = "Welcome, " + data.user.firstName + " " + data.user.lastName + "!";
                    document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                } else {
                    var msg = document.getElementById('loginMsg');
                    msg.style.display = 'block'; msg.innerText = data.message; msg.style.backgroundColor = '#f8d7da';
                }
            });
        };
    </script>
</body>
</html>
