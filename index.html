<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Login System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { width: 350px; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .primary-btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .secondary-btn { width: 100%; padding: 10px; background: none; color: #007bff; border: 1px solid #007bff; cursor: pointer; border-radius: 4px; margin-top: 15px; font-size: 14px; width: 100%; }
        .msg { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; text-align: center; }
        #registerView { display: none; }
    </style>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div id="loginView" class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="loginUser" placeholder="Username (first.m.last)" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <button type="submit" class="primary-btn">Sign In</button>
        </form>
        <div id="loginMsg" class="msg"></div>
        <button type="button" class="secondary-btn" id="regBtn">Register for account</button>
    </div>

    <!-- REGISTRATION SECTION -->
    <div id="registerView" class="form-container">
        <h2>Create Account</h2>
        <form id="registerForm">
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="mi" placeholder="Middle Initial" maxlength="1" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="password" id="regPass" placeholder="Set Password" required>
            <button type="submit" class="primary-btn">Create Account</button>
        </form>
        <div id="registerMsg" class="msg"></div>
        <button type="button" class="secondary-btn" id="backBtn">Back to Login</button>
    </div>

        var loginView = document.getElementById('loginView');
        var registerView = document.getElementById('registerView');

        document.getElementById('regBtn').onclick = function() {
            loginView.style.display = 'none';
            registerView.style.display = 'block';
        };

        document.getElementById('backBtn').onclick = function() {
            registerView.style.display = 'none';
            loginView.style.display = 'block';
        };
