<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { width: 420px; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        
        /* Wider containers */
        #accountsView { width: 800px; max-width: 95vw; }
        #cutterMovementsView { width: 1000px; max-width: 95vw; }
        #vmrEntryView { width: 900px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
        
        h2, h3, h4 { color: #333; margin-top: 0; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        
        input, select { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .primary-btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 10px; }
        .secondary-btn { width: 100%; padding: 10px; background: none; color: #007bff; border: 1px solid #007bff; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        .msg { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
        
        /* Hide all views by default */
        #registerView, #welcomeView, #accountsView, #cutterMovementsView, #vmrCenterView, #vmrEntryView { display: none; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .grid-btn { background-color: #e9ecef; color: #333; border: 1px solid #ccc; border-radius: 6px; padding: 15px 10px; font-weight: bold; cursor: pointer; }
        .grid-btn:hover { background-color: #007bff; color: white; border-color: #007bff; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; text-align: left; }
        th { background-color: #007bff; color: white; padding: 10px; }
        td { padding: 8px; border-bottom: 1px solid #ddd; }
        
        /* Cutter specific */
        .cutter-layout { display: flex; gap: 20px; text-align: left; }
        .cutter-data { flex: 2; border: 1px solid #ccc; padding: 15px; background: #fff; max-height: 500px; overflow-y: auto; }
        .cutter-controls { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .control-panel { padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .op-header { background: #d3d3d3; padding: 8px; font-weight: bold; text-align: center; margin-bottom: 10px; }

        /* VMR Form Grid */
        .vmr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        .vmr-grid label { font-weight: bold; font-size: 14px; color: #555; }
        .vmr-full-width { grid-column: span 2; }
    </style>
</head>
<body>

    <!-- 1. LOGIN -->
    <div id="loginView" class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="loginUser" placeholder="Username" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <button type="submit" class="primary-btn">Sign In</button>
        </form>
        <div id="loginMsg" class="msg"></div>
        <button type="button" class="secondary-btn" onclick="showView('registerView')">Register</button>
    </div>

    <!-- 2. REGISTER -->
    <div id="registerView" class="form-container">
        <h2>Create Account</h2>
        <form id="registerForm">
            <input type="text" id="fName" placeholder="First Name" required>
            <input type="text" id="mI" placeholder="Middle Initial" maxlength="1" required>
            <input type="text" id="lName" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="tel" id="phone" placeholder="Phone" required>
            <input type="password" id="regPass" placeholder="Password" required>
            <button type="submit" class="primary-btn">Create Account</button>
        </form>
        <div id="registerMsg" class="msg"></div>
        <button type="button" class="secondary-btn" onclick="showView('loginView')">Back</button>
    </div>

    <!-- 3. WELCOME DASHBOARD -->
    <div id="welcomeView" class="form-container">
        <h1 id="welcomeName" style="color:#0056b3;"></h1>
        <h3 id="dateDisplay" style="color:#555;"></h3>
        <div class="btn-grid">
            <button type="button" class="grid-btn" onclick="showView('vmrCenterView')">VMRs</button>
            <button type="button" class="grid-btn">Cutter Data Entry</button>
            <button type="button" class="grid-btn">Commercial Vessel Movements</button>
            <button type="button" class="grid-btn" onclick="loadCutterMovements()">Cutter Movements</button>
        </div>
        <button type="button" class="secondary-btn" onclick="loadAccounts()">View Accounts</button>
        <button type="button" class="secondary-btn" onclick="location.reload()" style="color:red; border-color:red;">Sign Out</button>
    </div>

    <!-- 4. ACCOUNTS -->
    <div id="accountsView" class="form-container">
        <h2>System Accounts</h2>
        <table id="accTable"><thead><tr><th>User</th><th>First</th><th>Last</th><th>Email</th></tr></thead><tbody id="accBody"></tbody></table>
        <button type="button" class="secondary-btn" onclick="showView('welcomeView')">Back to Dashboard</button>
    </div>

    <!-- 5. CUTTER MOVEMENTS -->
    <div id="cutterMovementsView" class="form-container">
        <h2>CUTTER MOVEMENTS</h2>
        <div class="cutter-layout">
            <div class="cutter-data" id="cutterData"></div>
            <div class="cutter-controls">
                <div class="control-panel" style="background: #e6eefa;">
                    <h4>Update Status</h4>
                    <select id="statCutter"></select>
                    <input type="text" id="statInput" placeholder="New status...">
                    <button class="primary-btn" onclick="updateStatus()">Update</button>
                </div>
                <div class="control-panel" style="background: #faf5e6;">
                    <h4>Reassign Operation</h4>
                    <select id="assignCutter"></select>
                    <select id="opSelect"><option>Operation TACONITE</option><option>Operation COAL SHOVEL</option></select>
                    <button class="primary-btn" onclick="assignOp()">Assign</button>
                </div>
            </div>
        </div>
        <button class="secondary-btn" onclick="showView('welcomeView')">Back</button>
    </div>

    <!-- 6. VMR CENTER -->
    <div id="vmrCenterView" class="form-container">
        <h2>VMR CENTER</h2>
        <hr style="border-top: 1px solid #ccc;">
        <button type="button" class="primary-btn" style="background-color: #2e8b57; padding: 20px;" onclick="showView('vmrEntryView')">Submit a VMR</button>
        <button type="button" class="primary-btn" style="background-color: #b22222; padding: 20px;" onclick="alert('Feature coming soon!')">View My Submitted VMRs</button>
        <hr style="border-top: 1px solid #ccc; margin-top: 20px;">
        <button type="button" class="secondary-btn" onclick="showView('welcomeView')">Back to Dashboard</button>
    </div>

    <!-- 7. VMR ENTRY FORM -->
    <div id="vmrEntryView" class="form-container">
        <h2 style="font-size: 1.2em;">DAILY VESSEL MOVEMENT REPORT<br><small style="color: #666;">Great Lakes Icebreaking Operations</small></h2>
        
        <form id="vmrForm">
            <div class="vmr-grid">
                <div class="vmr-full-width">
                    <label>Vessel Name *</label>
                    <input type="text" id="vesselName" required>
                </div>
                
                <!-- Date/Time Fields -->
                <div><label>Eastbound at Lansing Shoal</label><input type="datetime-local" id="eastLansing"></div>
                <div><label>Westbound Round Island</label><input type="datetime-local" id="westRound"></div>
                <div><label>Upbound DeTour Reef Light</label><input type="datetime-local" id="upDetour"></div>
                <div><label>Downbound Whitefish Point</label><input type="datetime-local" id="downWhitefish"></div>
                <div><label>ETA to Sturgeon Bay</label><input type="datetime-local" id="etaSturgeon"></div>
                <div><label>ETA to Rock Island Passage</label><input type="datetime-local" id="etaRock"></div>
                <div><label>Downbound ETA to LHC 11&12</label><input type="datetime-local" id="downLhc"></div>
                <div><label>Upbound ETA to SE Shoal/Detroit</label><input type="datetime-local" id="upSeShoal"></div>
                <div><label>ETD from Lake Erie/Huron Dock</label><input type="datetime-local" id="etdErieHuron"></div>
                <div><label>ETD from Detroit/St. Clair Dock</label><input type="datetime-local" id="etdDetroit"></div>
                
                <!-- Data Fields -->
                <div>
                    <label>Ice Breaker Requested?</label>
                    <select id="iceBreaker">
                        <option value="">-- Select --</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <div><label>Type of Cargo</label><input type="text" id="cargo"></div>
                <div><label>Destination</label><input type="text" id="dest"></div>
                
                <div class="vmr-full-width">
                    <label>Additional Information</label>
                    <input type="text" id="addInfo" placeholder="Information affecting ETA or ETD...">
                </div>
            </div>
            
            <div id="vmrMsg" class="msg"></div>
            <button type="submit" class="primary-btn" style="background-color: #2e8b57; font-size: 18px; margin-top: 20px;">Submit Report</button>
            <button type="button" class="secondary-btn" onclick="showView('vmrCenterView')">Cancel</button>
        </form>
    </div>

    <script>
        let loggedInUser = "";

        // Universal Navigation function
        function showView(viewId) {
            const views = ['loginView', 'registerView', 'welcomeView', 'accountsView', 'cutterMovementsView', 'vmrCenterView', 'vmrEntryView'];
            views.forEach(v => document.getElementById(v).style.display = 'none');
            document.getElementById(viewId).style.display = 'block';
        }

        // Authentication logic
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            fetch('/login', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({username: document.getElementById('loginUser').value.toLowerCase(), password: document.getElementById('loginPass').value})
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    loggedInUser = data.user.username;
                    document.getElementById('welcomeName').innerText = "Welcome, " + data.user.firstName + " " + data.user.lastName;
                    document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString();
                    showView('welcomeView');
                } else { alert("Login Failed: " + data.message); }
            });
        };

        document.getElementById('registerForm').onsubmit = function(e) {
            e.preventDefault();
            var f = document.getElementById('fName').value; var m = document.getElementById('mI').value; var l = document.getElementById('lName').value;
            fetch('/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: (f+'.'+m+'.'+l).toLowerCase(), password: document.getElementById('regPass').value,
                    firstName: f, middleInitial: m, lastName: l, email: document.getElementById('email').value, phone: document.getElementById('phone').value
                })
            }).then(res => res.json()).then(data => {
                var msg = document.getElementById('registerMsg');
                msg.style.display = 'block'; msg.innerText = data.message;
                msg.style.backgroundColor = data.success ? '#d4edda' : '#f8d7da';
                if(data.success) setTimeout(() => showView('loginView'), 2000);
            });
        };

        function loadAccounts() {
            fetch('/accounts').then(res => res.json()).then(data => {
                let b = document.getElementById('accBody'); b.innerHTML = '';
                data.accounts.forEach(a => { b.innerHTML += `<tr><td>${a.username}</td><td>${a.firstName}</td><td>${a.lastName}</td><td>${a.email}</td></tr>`; });
                showView('accountsView');
            });
        }

        // Cutter logic
        function loadCutterMovements() {
            fetch('/cutters').then(res => res.json()).then(data => {
                if (!data.success) return alert("Error loading cutters.");
                const cont = document.getElementById('cutterData'); const sD = document.getElementById('statCutter'); const aD = document.getElementById('assignCutter');
                cont.innerHTML = ''; sD.innerHTML = ''; aD.innerHTML = '';
                data.cutters.forEach(c => { let o = `<option value="${c.name}">${c.name}</option>`; sD.innerHTML += o; aD.innerHTML += o; });
                ["Operation TACONITE", "Operation COAL SHOVEL"].forEach(op => {
                    let html = `<div class="op-header">${op}</div><table><thead><tr><th>Cutter</th><th>Updated</th><th>Status</th></tr></thead><tbody>`;
                    let filtered = data.cutters.filter(c => c.operation === op);
                    filtered.forEach(c => { html += `<tr><td><b>${c.name}</b></td><td>${c.last_updated}<br>${c.updated_by}</td><td>${c.status}</td></tr>`; });
                    html += `</tbody></table><br>`; cont.innerHTML += html;
                });
                showView('cutterMovementsView');
            });
        }

        function updateStatus() {
            fetch('/cutters/status', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({vessel: document.getElementById('statCutter').value, status: document.getElementById('statInput').value, currentUser: loggedInUser})
            }).then(() => { document.getElementById('statInput').value=''; loadCutterMovements(); });
        }

        function assignOp() {
            fetch('/cutters/operation', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({vessel: document.getElementById('assignCutter').value, operation: document.getElementById('opSelect').value})
            }).then(() => loadCutterMovements());
        }

        // --- NEW: VMR LOGIC ---
        document.getElementById('vmrForm').onsubmit = function(e) {
            e.preventDefault();
            const payload = {
                submitter: loggedInUser,
                vesselName: document.getElementById('vesselName').value,
                eastLansing: document.getElementById('eastLansing').value,
                westRound: document.getElementById('westRound').value,
                upDetour: document.getElementById('upDetour').value,
                downWhitefish: document.getElementById('downWhitefish').value,
                etaSturgeon: document.getElementById('etaSturgeon').value,
                etaRock: document.getElementById('etaRock').value,
                downLhc: document.getElementById('downLhc').value,
                upSeShoal: document.getElementById('upSeShoal').value,
                etdErieHuron: document.getElementById('etdErieHuron').value,
                etdDetroit: document.getElementById('etdDetroit').value,
                iceBreaker: document.getElementById('iceBreaker').value,
                cargo: document.getElementById('cargo').value,
                dest: document.getElementById('dest').value,
                addInfo: document.getElementById('addInfo').value
            };

            fetch('/vmrs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(res => res.json()).then(data => {
                var msg = document.getElementById('vmrMsg');
                msg.style.display = 'block';
                msg.innerText = data.message;
                msg.style.backgroundColor = data.success ? '#d4edda' : '#f8d7da';
                
                if(data.success) {
                    setTimeout(() => {
                        document.getElementById('vmrForm').reset(); // Clear the form
                        msg.style.display = 'none';
                        showView('vmrCenterView'); // Go back to VMR menu
                    }, 2000);
                }
            }).catch(err => alert("Submission Error."));
        };
    </script>
</body>
</html>
