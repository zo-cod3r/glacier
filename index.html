<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { width: 350px; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #333; margin-top: 0; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .primary-btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .primary-btn:hover { background-color: #0056b3; }
        
        .secondary-btn { width: 100%; padding: 10px; background: none; color: #007bff; border: 1px solid #007bff; cursor: pointer; border-radius: 4px; margin-top: 15px; font-size: 14px; display: block; width: 100%; }
        
        .msg { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
        
        /* Views */
        #registerView, #welcomeView { display: none; }
        #welcomeView h1 { color: #0056b3; margin-bottom: 5px; }
        #currentDate { color: #666; font-style: italic; font-size: 1.1em; }
    </style>
</head>
<body>

    <!-- 1. LOGIN VIEW -->
    <div id="loginView" class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="loginUser" placeholder="Username (first.m.last)" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <button type="submit" class="primary-btn">Sign In</button>
        </form>
        <div id="loginMsg" class="msg"></div>
        <button type="button" class="secondary-btn" id="toRegisterBtn">Register for account</button>
    </div>

    <!-- 2. REGISTRATION VIEW -->
    <div id="registerView" class="form-container">
        <h2>Create Account</h2>
        <form id="registerForm">
            <input type="text" id="firstName" placeholder="First Name" required>
            <input type="text" id="mi" placeholder="Middle Initial" maxlength="1" required>
            <input type="text" id="lastName" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="password" id="regPass" placeholder="Set Password" required>
            <button type="submit" class="primary-btn">Create Account</button>
        </form>
        <div id="registerMsg" class="msg"></div>
        <button type="button" class="secondary-btn" id="toLoginBtn">Back to Login</button>
    </div>

    <!-- 3. WELCOME VIEW -->
    <div id="welcomeView" class="form-container">
        <h1 id="welcomeName">Welcome!</h1>
        <p id="currentDate"></p>
        <button type="button" class="secondary-btn" onclick="location.reload()">Sign Out</button>
    </div>

    <script>
        // --- NAVIGATION LOGIC ---
        const loginView = document.getElementById('loginView');
        const registerView = document.getElementById('registerView');
        const welcomeView = document.getElementById('welcomeView');

        function showView(view) {
            loginView.style.display = 'none';
            registerView.style.display = 'none';
            welcomeView.style.display = 'none';
            view.style.display = 'block';
        }

        // Attach listeners to navigation buttons
        document.getElementById('toRegisterBtn').addEventListener('click', () => showView(registerView));
        document.getElementById('toLoginBtn').addEventListener('click', () => showView(loginView));

        // --- REGISTRATION LOGIC ---
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fName = document.getElementById('firstName').value.trim().toLowerCase();
            const mi = document.getElementById('mi').value.trim().toLowerCase();
            const lName = document.getElementById('lastName').value.trim().toLowerCase();
            const autoUsername = `${fName}.${mi}.${lName}`;

            const data = {
                username: autoUsername,
                password: document.getElementById('regPass').value,
                firstName: document.getElementById('firstName').value.trim(),
                middleInitial: document.getElementById('mi').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim()
            };

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const res = await response.json();
                const msgDiv = document.getElementById('registerMsg');
                msgDiv.style.display = 'block';
                msgDiv.innerText = res.message;
                msgDiv.style.backgroundColor = res.success ? '#d4edda' : '#f8d7da';
                
                if(res.success) setTimeout(() => showView(loginView), 2000);
            } catch (err) {
                alert("Check if your server.js is running!");
            }
        });
